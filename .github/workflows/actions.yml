
name: Run TA Automation

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes UTC
  workflow_dispatch:

concurrency:
  group: ta-automation-pipeline
  cancel-in-progress: false

jobs:
  run-ta-automation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Python environment
        run: |
          python --version
          pip --version

      - name: Execute TA_Automation.py
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          TA_SESSIONS_QUERY: ${{ secrets.TA_SESSIONS_QUERY }}
          TA_BATCH_QUERY: ${{ secrets.TA_BATCH_QUERY }}
          TA_SLOTS_QUERY: ${{ secrets.TA_SLOTS_QUERY }}
          TA_SHEET_ACCESS_KEY: ${{ secrets.TA_SHEET_ACCESS_KEY }}

        run: |
          echo "=============================="
          echo "Workflow triggered at UTC: $(date -u)"
          echo "Current branch: $GITHUB_REF"
          echo "Repository path: $GITHUB_WORKSPACE"
          echo "=============================="

          echo "Starting TA_Automation.py..."

          python TA_Automation.py

          echo "TA_Automation.py executed successfully."
